name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run scanner tests
        run: npm test

      - name: Regenerate example reports
        run: npm run audit && npm run gate:demo

      - name: Verify reports are current
        run: git diff --exit-code -- reports
